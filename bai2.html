<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký khóa học</title>
    <style>
        #form-dang-ky {
            width: 400px;
            border: 1px solid gray;
            padding: 20px;
            background-color: whitesmoke;
        }
        h2 {
            color: blue;
            text-align: center;
        }
        label {
            font-size: 16px;
        }
        input {
            padding: 5px;
        }
        .nut-dang-ky {
            background-color: blue;
            color: white;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h2>Đăng ký khóa học</h2>
    <form action="" id="form-dang-ky">
        <p>
            <label for="">Họ và tên</label>
            <input type="text">
        </p>
        <p>
            <label for="">Email</label>
            <input type="email">
        </p>
         <p>
            <label for="">Mật khẩu</label>
            <input type="password">
        </p>
        <p>
            <label for="">Giới tính</label>
            <input type="radio" name="gioi-tinh">Nam
            <input type="radio" name="gioi-tinh">Nữ
        </p>
        <p>
            <label for="">Khóa học</label>
            <select name="" id="">
                <option value="">HTML/CSS</option>
                <option value="">JavaScript</option>
                <option value="">ReactJS</option>
            </select>
        </p>
        <p>
            <label for="">Ghi chú</label>
            <textarea name="" id=""></textarea>
        </p>
        <p>
            <input type="checkbox" name="" id="">
            Tôi đồng ý với điều khoản
        </p>
        <button type="submit" class="nut-dang-ky">Đăng ký</button>
    </form>
</body>
</html>
